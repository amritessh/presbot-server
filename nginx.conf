server {
    listen 80;
    server_name api.presbot.dashlab.studio;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.presbot.dashlab.studio;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/api.presbot.dashlab.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.presbot.dashlab.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        if ($request_method = OPTIONS ) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With, X-CSRFToken, X-Frame-Options, X-XSRF-TOKEN, x-client-timestamp, x-request-hash" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_read_timeout 900;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;

        proxy_pass http://localhost:6969;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;
}


